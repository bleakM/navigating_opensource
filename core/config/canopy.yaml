# Grove's existing planner, tuned for geometric SLAM rather than exhaustive semantic inspection.
/**:
  ros__parameters:
    # Simulated depth stamps are capture times and each frame uses its own TF.
    # Credit valid observations during walking instead of requiring another visit.
    require_stillness: false
    planner:
      robot_radius: 0.45
      clearance_margin: 0.25
      frontier_clearance: 0.35
      travel_margin: 0.05
      # Cost estimate for the current 0.60 m/s controller, allowing turns and
      # acceleration. This is a planner estimate, not an extra velocity command.
      travel_speed: 0.50
      turn_speed: 0.8
      dwell_time: 0.4
      max_headings: 2
      min_heading_gain: 100.0
      # A failed viewpoint beside furniture should invoke Grove's existing
      # StepClear immediately, before another long Nav2 recovery cycle.
      max_failures_in_a_row: 1
      # Finish after frontier traversal and useful views; do not enforce a
      # photographic quota for each wall or furniture surface. A small floor
      # quota keeps a representative RGB-D view of otherwise weak room geometry.
      # RGB-D coverage here supplements the 360-degree LiDAR SLAM map. Do not
      # spend another full tour trying to photograph every furnished surface.
      # Observed-room visits gate saving in explore.py; full-scene coverage
      # is evaluated separately and is not an operational planning input.
      room_floor_goal: 0.15
      room_face_goal: 0.0
      min_viewpoint_rate: 80.0
      min_viewpoint_gain: 320.0
      frontier_stall_visits: 3
      # Tiny unknown islands behind chair legs are sensor shadows. The original
      # pocket planner remains available for openings at least this large.
      pocket_min_area: 0.75
      pocket_min_edge: 0.75
    approach:
      standoff: 0.72
      margin: 0.20
