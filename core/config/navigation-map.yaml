# Standard Nav2 denoising of observed RTAB-Map occupancy, without inflation.
# Original /map, point cloud, database and SLAM parameters remain untouched.
/**:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 1.0
    initial_transform_timeout: 300.0
    rolling_window: false
    track_unknown_space: true
    resolution: 0.05
    update_frequency: 2.0
    publish_frequency: 2.0
    always_send_full_costmap: true
    plugins: [static_layer, denoise_layer]
    static_layer:
      plugin: nav2_costmap_2d::StaticLayer
      map_topic: /map
      map_subscribe_transient_local: true
      footprint_clearing_enabled: false
    denoise_layer:
      plugin: nav2_costmap_2d::DenoiseLayer
      enabled: true
      minimal_group_size: 2
      group_connectivity_type: 8
