# Derived from Grove-G1; simulated time, RGB-D obstacle input and gentler Nav2 commands.
bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 1.0
    odom_topic: /g1_odometry_publisher/odom
    navigators:
    - navigate_to_pose
    - navigate_through_poses
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
    navigate_through_poses:
      plugin: nav2_bt_navigator::NavigateThroughPosesNavigator
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: true
bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: true
controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins:
    - progress_checker
    goal_checker_plugins:
    - general_goal_checker
    controller_plugins:
    - FollowPath
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.5
      movement_time_allowance: 20.0
    general_goal_checker:
      stateful: true
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.5
    FollowPath:
      # RPP already rotates before following a path. Using its built-in behavior
      # avoids the outer shim's fresh-stamped path lookup against scan-time LIO.
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      rotate_to_heading_angular_vel: 0.7
      max_angular_accel: 1.5
      desired_linear_vel: 0.35
      min_approach_linear_velocity: 0.2
      approach_velocity_scaling_dist: 0.8
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      use_rotate_to_heading: true
      allow_reversing: false
      rotate_to_heading_min_angle: 0.35
      # Keep above xy_goal_tolerance (0.25), or RPP treats its nearby carrot
      # as the goal and only tries to turn to the final heading.
      lookahead_dist: 0.65
      use_velocity_scaled_lookahead_dist: false
      transform_tolerance: 1.0
      regulated_linear_scaling_min_speed: 0.2
      cost_scaling_dist: 0.7
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 1.5
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      transform_tolerance: 0.3
      # Delayed localization bringup may start after sim time 60 s. The first
      # /clock sample can otherwise exhaust Nav2's default 60 s startup budget.
      # This only waits while stationary for TF; collision limits are unchanged.
      initial_transform_timeout: 300.0
      use_sim_time: true
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      robot_radius: 0.45
      plugins:
      - static_layer
      - voxel_layer
      - inflation_layer
      # Keep SLAM-observed furniture in the rolling map too. Otherwise StepClear
      # can report a clear live scan while Nav2's global map still sees a collision.
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 1.5
        inflation_radius: 1.2
      voxel_layer:
        plugin: nav2_costmap_2d::VoxelLayer
        enabled: true
        publish_voxel_map: true
        origin_z: 0.0
        z_resolution: 0.125
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: lidar chest_depth
        lidar:
          topic: /livox/lidar
          data_type: PointCloud2
          clearing: true
          marking: true
          min_obstacle_height: 0.08
          max_obstacle_height: 1.8
          raytrace_max_range: 6.0
          raytrace_min_range: 0.0
          obstacle_max_range: 3.0
          obstacle_min_range: 0.6
        chest_depth:
          topic: /chest_camera/points
          data_type: PointCloud2
          clearing: true
          marking: true
          min_obstacle_height: 0.1
          max_obstacle_height: 1.8
          raytrace_max_range: 4.5
          raytrace_min_range: 0.0
          obstacle_max_range: 3.5
          obstacle_min_range: 0.45
      filters:
      - keepout_filter
      keepout_filter:
        plugin: nav2_costmap_2d::KeepoutFilter
        enabled: $(var keepout)
        filter_info_topic: /costmap_filter_info
      always_send_full_costmap: true
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      transform_tolerance: 0.3
      initial_transform_timeout: 300.0
      use_sim_time: true
      robot_radius: 0.45
      resolution: 0.05
      track_unknown_space: true
      plugins:
      - static_layer
      - obstacle_layer
      - inflation_layer
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: lidar chest_depth
        lidar:
          topic: /livox/lidar
          data_type: PointCloud2
          clearing: true
          marking: true
          min_obstacle_height: 0.08
          max_obstacle_height: 1.8
          raytrace_max_range: 6.0
          raytrace_min_range: 0.0
          obstacle_max_range: 3.0
          obstacle_min_range: 0.6
        chest_depth:
          topic: /chest_camera/points
          data_type: PointCloud2
          clearing: true
          marking: true
          min_obstacle_height: 0.1
          max_obstacle_height: 1.8
          raytrace_max_range: 4.5
          raytrace_min_range: 0.0
          obstacle_max_range: 3.5
          obstacle_min_range: 0.45
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 1.5
        inflation_radius: 1.2
      filters:
      - keepout_filter
      - speed_filter
      keepout_filter:
        plugin: nav2_costmap_2d::KeepoutFilter
        enabled: $(var keepout)
        filter_info_topic: /costmap_filter_info
      speed_filter:
        plugin: nav2_costmap_2d::SpeedFilter
        enabled: $(var keepout)
        filter_info_topic: /speed_filter_info
        speed_limit_topic: /speed_limit
      always_send_full_costmap: true
planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    use_sim_time: true
    planner_plugins:
    - GridBased
    GridBased:
      plugin: nav2_navfn_planner::NavfnPlanner
      # NavFn searches a square around an obstructed requested goal. Combined
      # with the controller's tolerance, keep the final error below 0.5 m.
      tolerance: 0.1
      use_astar: false
      allow_unknown: true
behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins:
    - spin
    - drive_on_heading
    - wait
    spin:
      plugin: nav2_behaviors::Spin
    drive_on_heading:
      plugin: nav2_behaviors::DriveOnHeading
    wait:
      plugin: nav2_behaviors::Wait
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 1.0
    use_sim_time: true
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.9
    min_rotational_vel: 0.3
    rotational_acc_lim: 1.0
collision_monitor:
  ros__parameters:
    use_sim_time: true
    base_frame_id: base_footprint
    odom_frame_id: odom
    cmd_vel_in_topic: /cmd_vel_raw
    cmd_vel_out_topic: /cmd_vel
    state_topic: collision_monitor_state
    transform_tolerance: 0.3
    source_timeout: 1.0
    base_shift_correction: true
    stop_pub_timeout: 2.0
    enable_stamped_cmd_vel: false
    polygons:
    - body
    - nervros_slow
    - nervros_stop
    body:
      type: circle
      radius: 0.45
      action_type: approach
      time_before_collision: 1.0
      simulation_time_step: 0.1
      min_points: 4
      visualize: true
      polygon_pub_topic: collision_monitor_body
      enabled: true
    nervros_slow:
      type: polygon
      polygon_sub_topic: nervros/collision_slow
      polygon_subscribe_transient_local: true
      action_type: slowdown
      slowdown_ratio: 0.4
      min_points: 4
      visualize: true
      polygon_pub_topic: collision_monitor_nervros_slow
      enabled: false
    nervros_stop:
      type: polygon
      polygon_sub_topic: nervros/collision_stop
      polygon_subscribe_transient_local: true
      action_type: stop
      min_points: 4
      visualize: true
      polygon_pub_topic: collision_monitor_nervros_stop
      enabled: false
    observation_sources:
    - low_cloud
    - high_cloud
    - chest_depth
    low_cloud:
      type: pointcloud
      topic: /livox/lidar
      min_height: 0.05
      max_height: 0.6
      enabled: true
    high_cloud:
      type: pointcloud
      topic: /livox/lidar
      min_height: 1.05
      max_height: 1.4
      enabled: true
    chest_depth:
      type: pointcloud
      topic: /chest_camera/points
      min_height: 0.1
      max_height: 1.4
      enabled: true
costmap_filter_info_server:
  ros__parameters:
    use_sim_time: true
    type: 0
    filter_info_topic: /costmap_filter_info
    mask_topic: /keepout_filter_mask
    base: 0.0
    multiplier: 1.0
lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: true
    autostart: true
    node_names:
    - controller_server
    - planner_server
    - behavior_server
    - bt_navigator
    - collision_monitor
lifecycle_manager_filters:
  ros__parameters:
    use_sim_time: true
    autostart: true
    node_names:
    - costmap_filter_info_server
